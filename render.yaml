services:
  - type: web
    name: syllasync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn src.app:app --bind 0.0.0.0:$PORT
    envVars:
      # LLM 업로드 분석을 쓰려면 아래 키를 Render 대시보드에서 설정 (선택).
      # 설정하지 않으면 내장 데이터셋 + 규칙 기반 분석으로 동작합니다.
      - key: OPENAI_API_KEY
        sync: false
