    <!-- 6/11 기말 -->
    <rect x="316" y="358" width="88" height="15" rx="3" fill="#fee2e2"/><rect x="316" y="358" width="3" height="15" fill="#16a34a"/>
    <text x="322" y="369" fill="#b91c1c">Final Exam</text>
