<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <rect width="720" height="500" fill="#f8fafc"/>

  <!-- 마감 임박 배너 -->
  <rect x="24" y="16" width="672" height="70" rx="10" fill="#fff1f2" stroke="#fecdd3"/>
  <text x="40" y="40" font-size="13.5" font-weight="700" fill="#be123c">🔔 마감 임박 (오늘 기준 14일 이내)</text>
  <text x="40" y="60" font-size="12" fill="#be123c">· D-1  2026-06-02 — 기초영어 · Presentation</text>
  <text x="40" y="76" font-size="12" fill="#be123c">· D-10 2026-06-11 — 기초영어 · Final Exam   · D-11 2026-06-12 — 물리학 1 · 기말고사</text>

  <!-- 과부하 -->
  <rect x="24" y="96" width="672" height="44" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="40" y="114" font-size="13" font-weight="700" fill="#b91c1c">⚠️ 과부하 주의 주차</text>
  <text x="40" y="131" font-size="11.5" fill="#b91c1c">· 2026-06-08 주: 마감/시험 6건 몰림 (기말고사 3건, 보고서 2건, HW #5)</text>

  <!-- 범례 -->
  <g font-size="11">
