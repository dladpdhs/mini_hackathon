  <!-- 날짜 숫자 (1주차: 1~7) -->
  <g font-size="10" fill="#94a3b8">
    <text x="30" y="232">1</text><text x="126" y="232">2</text><text x="222" y="232">3</text>
    <text x="318" y="232">4</text><text x="414" y="232">5</text><text x="510" y="232">6</text><text x="606" y="232">7</text>
    <text x="30" y="352">8</text><text x="126" y="352">9</text><text x="222" y="352">10</text>
    <text x="318" y="352">11</text><text x="414" y="352">12</text><text x="510" y="352">13</text><text x="606" y="352">14</text>
  </g>

  <!-- 칩 -->
  <g font-size="9">
    <!-- 6/1 강의 -->
    <rect x="28" y="238" width="88" height="15" rx="3" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="0"/>
    <rect x="28" y="238" width="3" height="15" fill="#9333ea"/><text x="34" y="249" fill="#7c3aed">📘 발표 및 상호 논평</text>
    <!-- 6/2 발표 -->
    <rect x="124" y="238" width="88" height="15" rx="3" fill="#fce7f3"/><rect x="124" y="238" width="3" height="15" fill="#16a34a"/>
