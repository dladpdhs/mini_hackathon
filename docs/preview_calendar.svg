    <text x="84" y="162" fill="#2563eb">■ 과제</text>
    <text x="140" y="162" fill="#ea580c">■ 퀴즈</text>
    <text x="196" y="162" fill="#dc2626">■ 시험</text>
    <text x="252" y="162" fill="#db2777">■ 발표</text>
    <text x="320" y="162" fill="#64748b">· 칩 왼쪽 색띠 = 과목 구분</text>
  </g>

  <text x="24" y="188" font-size="15" font-weight="700" fill="#0f172a">2026년 6월</text>

  <!-- 달력 헤더 -->
  <g font-size="11" fill="#64748b">
    <rect x="24" y="196" width="672" height="22" fill="#f1f5f9"/>
    <text x="60" y="211" text-anchor="middle">월</text><text x="156" y="211" text-anchor="middle">화</text>
    <text x="252" y="211" text-anchor="middle">수</text><text x="348" y="211" text-anchor="middle">목</text>
    <text x="444" y="211" text-anchor="middle">금</text><text x="540" y="211" text-anchor="middle" fill="#f87171">토</text>
    <text x="636" y="211" text-anchor="middle" fill="#f87171">일</text>
  </g>

  <!-- 그리드 (2주만 표시) -->
  <g stroke="#e2e8f0" fill="#fff">
    <rect x="24" y="218" width="96" height="120"/><rect x="120" y="218" width="96" height="120"/>
    <rect x="216" y="218" width="96" height="120"/><rect x="312" y="218" width="96" height="120"/>
    <rect x="408" y="218" width="96" height="120"/><rect x="504" y="218" width="96" height="120" fill="#f8fafc"/>
    <rect x="600" y="218" width="96" height="120" fill="#f8fafc"/>
    <rect x="24" y="338" width="96" height="130"/><rect x="120" y="338" width="96" height="130"/>
    <rect x="216" y="338" width="96" height="130"/><rect x="312" y="338" width="96" height="130"/>
    <rect x="408" y="338" width="96" height="130"/><rect x="504" y="338" width="96" height="130" fill="#f8fafc"/>
    <rect x="600" y="338" width="96" height="130" fill="#f8fafc"/>
